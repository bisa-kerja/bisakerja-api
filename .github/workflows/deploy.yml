name: Deploy Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: true
        default: develop
        type: string

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  CONTAINER_REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.yml
  RUNTIME_ENV_FILE: .env.production
  DEFAULT_APP_PORT: "3000"
  DEPLOY_TARGET: staging
  EXPECTED_APP_ENV: staging
  COMPOSE_PROJECT_NAME: bisakerja-api

jobs:
  build-and-push:
    name: Build And Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    outputs:
      deploy_branch: ${{ steps.meta.outputs.deploy_branch }}
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref }}

      - name: Resolve image metadata
        id: meta
        run: |
          set -euo pipefail

          deploy_branch="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref_name }}"

          case "$deploy_branch" in
            develop|main)
              ;;
            *)
              echo "::error::Unsupported deploy branch: $deploy_branch"
              exit 1
              ;;
          esac

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="$deploy_branch"
          source_sha="$(git rev-parse HEAD)"

          {
            echo "deploy_branch=$deploy_branch"
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_name:$image_tag"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:sha-${{ steps.meta.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Validate required deployment secrets
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          DEPLOY_VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          DEPLOY_VPS_KEY: ${{ secrets.DEPLOY_VPS_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEPLOY_VPS_KNOWN_HOSTS }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          GHCR_READ_PACKAGES_TOKEN: ${{ secrets.GHCR_READ_PACKAGES_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          set -euo pipefail

          required=(
            DEPLOY_VPS_HOST
            DEPLOY_VPS_PORT
            DEPLOY_VPS_USERNAME
            DEPLOY_VPS_KEY
            DEPLOY_VPS_KNOWN_HOSTS
            DEPLOY_REMOTE_PATH
            DEPLOY_ENV_FILE
            GHCR_READ_PACKAGES_TOKEN
            GH_USERNAME
          )

          missing=0

          for secret_name in "${required[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Prepare SSH client
        env:
          DEPLOY_VPS_KEY: ${{ secrets.DEPLOY_VPS_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEPLOY_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_VPS_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Write runtime env file on VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          set -euo pipefail

          ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "install -d -m 755 '$REMOTE_PATH'"
          printf '%s' "$DEPLOY_ENV_FILE" | base64 -w0 | \
            ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "base64 -d > '$REMOTE_PATH/${{ env.RUNTIME_ENV_FILE }}' && chmod 600 '$REMOTE_PATH/${{ env.RUNTIME_ENV_FILE }}'"

      - name: Log in to GHCR on VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          GHCR_READ_PACKAGES_TOKEN: ${{ secrets.GHCR_READ_PACKAGES_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_READ_PACKAGES_TOKEN" | \
            ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "docker login ghcr.io -u '$GH_USERNAME' --password-stdin"

      - name: Run remote deployment
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_BRANCH: ${{ needs.build-and-push.outputs.deploy_branch }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_PORT: ${{ env.DEFAULT_APP_PORT }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          RUNTIME_ENV_FILE: ${{ env.RUNTIME_ENV_FILE }}
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          EXPECTED_APP_ENV: ${{ env.EXPECTED_APP_ENV }}
          COMPOSE_PROJECT_NAME: ${{ env.COMPOSE_PROJECT_NAME }}
        run: |
          set -euo pipefail

          ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" \
            "bash -s -- '$REMOTE_PATH' '$DEPLOY_BRANCH' '$IMAGE_NAME' '$IMAGE_TAG' '$APP_PORT' '$COMPOSE_FILE' '$RUNTIME_ENV_FILE' '$DEPLOY_TARGET' '$EXPECTED_APP_ENV' '$COMPOSE_PROJECT_NAME'" \
            < scripts/deploy/remote-deploy.sh

      - name: Collect remote diagnostics on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          APP_PORT: ${{ env.DEFAULT_APP_PORT }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          RUNTIME_ENV_FILE: ${{ env.RUNTIME_ENV_FILE }}
          COMPOSE_PROJECT_NAME: ${{ env.COMPOSE_PROJECT_NAME }}
        run: |
          set +e

          ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "
            cd '$REMOTE_PATH' &&
            export APP_PORT='$APP_PORT' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' &&
            docker compose -f '$COMPOSE_FILE' --env-file '$RUNTIME_ENV_FILE' ps &&
            docker compose -f '$COMPOSE_FILE' --env-file '$RUNTIME_ENV_FILE' logs --tail=100 app db
          "
