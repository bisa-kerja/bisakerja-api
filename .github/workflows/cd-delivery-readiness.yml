name: CD Delivery Readiness

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: cd-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-readiness:
    name: Delivery Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
      DIRECT_DATABASE_URL: ""
      RUN_DATABASE_TESTS: "false"
      MODEL_API_ENABLE_MOCK: "true"
      LOG_LEVEL: silent
      ENABLE_REQUEST_LOGGING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Prisma validate
        run: bun run prisma:validate

      - name: Typecheck
        run: bun run typecheck

      - name: Generate docs bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bun run docs:generate:openapi
          bun run docs:generate:routes
          bun run docs:generate:sync-readiness
          bun run docs:check
          bun run docs:scalar:check-config

      - name: Ensure committed OpenAPI artifact is in sync
        run: git diff --exit-code -- docs/generated/openapi.json

      - name: Upload docs sync bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-docs-${{ github.sha }}
          path: docs
          if-no-files-found: error
