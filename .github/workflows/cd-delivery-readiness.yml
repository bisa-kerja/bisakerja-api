name: CD Delivery Readiness

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: cd-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-readiness:
    name: Delivery Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
      DIRECT_DATABASE_URL: ""
      RUN_DATABASE_TESTS: "false"
      MODEL_API_ENABLE_MOCK: "true"
      MODEL_API_SERVICE_TOKEN: ci-model-api-token
      AUTH_ACCESS_TOKEN_SECRET: ci-access-secret
      AUTH_REFRESH_TOKEN_SECRET: ci-refresh-secret
      AUTH_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 7d
      PASSWORD_RESET_TOKEN_TTL: 30m
      EMAIL_VERIFICATION_OTP_TTL: 10m
      AUTH_REFRESH_COOKIE_NAME: bisakerja_refresh
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_ISSUER: bisakerja-api
      AUTH_AUDIENCE: bisakerja-frontend
      APP_NAME: bisakerja-api
      PORT: "3000"
      API_PREFIX: /api/v1
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: "false"
      REQUEST_BODY_LIMIT: 1mb
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "120"
      AUTH_RATE_LIMIT_MAX: "10"
      UPLOAD_RATE_LIMIT_MAX: "10"
      AI_RATE_LIMIT_MAX: "20"
      FILE_STORAGE_DRIVER: local
      UPLOAD_STORAGE_PATH: ./storage/uploads
      CV_UPLOAD_MAX_BYTES: "5242880"
      CV_ALLOWED_MIME_TYPES: application/pdf
      CV_RETENTION_DAYS: "1"
      EMAIL_PROVIDER: fake
      EMAIL_FROM: Bisakerja <no-reply@example.test>
      LOG_LEVEL: silent
      REQUEST_ID_HEADER: x-request-id
      ENABLE_REQUEST_LOGGING: "false"
      HEALTH_CHECK_TIMEOUT_MS: "2000"
      PRISMA_LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validate
        run: bun run prisma:validate

      - name: Typecheck
        run: bun run typecheck

      - name: Generate docs bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bun run docs:generate:openapi
          bun run docs:generate:routes
          bun run docs:generate:sync-readiness
          bun run docs:check
          bun run docs:scalar:check-config

      - name: Ensure committed OpenAPI artifact is in sync
        run: git diff --exit-code -- docs/generated/openapi.json

      - name: Upload docs sync bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-docs-${{ github.sha }}
          path: docs
          if-no-files-found: error
