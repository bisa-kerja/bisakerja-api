name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality And Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI test environment variables
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
        run: |
          set -euo pipefail

          ci_env_file=".tmp/ci-quality.env"
          mkdir -p .tmp

          if [ -n "${TEST_ENV_FILE:-}" ]; then
            printf '%s\n' "${TEST_ENV_FILE}" > "$ci_env_file"
          else
            cp .env.test.example "$ci_env_file"
          fi

          tr -d '\r' < "$ci_env_file" > "${ci_env_file}.normalized"
          mv "${ci_env_file}.normalized" "$ci_env_file"
          set -a
          # shellcheck disable=SC1090
          . "$ci_env_file"
          set +a

          append_env() {
            local key="$1"
            local value="${!key-}"
            {
              echo "${key}<<__ENV_VALUE__"
              printf '%s\n' "$value"
              echo "__ENV_VALUE__"
            } >> "$GITHUB_ENV"
          }

          append_override() {
            local key="$1"
            local value="$2"
            {
              echo "${key}<<__ENV_VALUE__"
              printf '%s\n' "$value"
              echo "__ENV_VALUE__"
            } >> "$GITHUB_ENV"
          }

          while IFS= read -r key; do
            append_env "$key"
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ci_env_file" | cut -d'=' -f1)

          append_override APP_ENV test
          append_override NODE_ENV test
          append_override DATABASE_URL postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
          append_override DIRECT_DATABASE_URL postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
          append_override REDIS_URL redis://127.0.0.1:6379
          append_override RUN_DATABASE_TESTS false
          append_override MODEL_API_ENABLE_MOCK true
          append_override LOG_LEVEL silent
          append_override ENABLE_REQUEST_LOGGING false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Prisma validate
        run: bun run prisma:validate

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Generate docs artifacts
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bun run docs:generate:openapi
          bun run docs:generate:routes
          bun run docs:generate:sync-readiness

      - name: Validate docs
        run: |
          bun run docs:check
          bun run docs:scalar:check-config

      - name: Ensure committed OpenAPI artifact is in sync
        run: git diff --exit-code -- docs/generated/openapi.json

      - name: Run default test suite
        run: bun test

      - name: Run route tests
        run: bun run test:routes

      - name: Run contract tests
        run: bun run test:contracts

      - name: Run smoke tests
        run: bun run test:smoke

  database-verification:
    name: Database Integration And Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bisakerja_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bisakerja_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI test environment variables
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
        run: |
          set -euo pipefail

          ci_env_file=".tmp/ci-database.env"
          mkdir -p .tmp

          if [ -n "${TEST_ENV_FILE:-}" ]; then
            printf '%s\n' "${TEST_ENV_FILE}" > "$ci_env_file"
          else
            cp .env.test.example "$ci_env_file"
          fi

          tr -d '\r' < "$ci_env_file" > "${ci_env_file}.normalized"
          mv "${ci_env_file}.normalized" "$ci_env_file"
          set -a
          # shellcheck disable=SC1090
          . "$ci_env_file"
          set +a

          append_env() {
            local key="$1"
            local value="${!key-}"
            {
              echo "${key}<<__ENV_VALUE__"
              printf '%s\n' "$value"
              echo "__ENV_VALUE__"
            } >> "$GITHUB_ENV"
          }

          append_override() {
            local key="$1"
            local value="$2"
            {
              echo "${key}<<__ENV_VALUE__"
              printf '%s\n' "$value"
              echo "__ENV_VALUE__"
            } >> "$GITHUB_ENV"
          }

          while IFS= read -r key; do
            append_env "$key"
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ci_env_file" | cut -d'=' -f1)

          append_override APP_ENV test
          append_override NODE_ENV test
          append_override DATABASE_URL postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
          append_override DIRECT_DATABASE_URL postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
          append_override REDIS_URL redis://127.0.0.1:6379
          append_override RUN_DATABASE_TESTS true
          append_override MODEL_API_ENABLE_MOCK true
          append_override LOG_LEVEL silent
          append_override ENABLE_REQUEST_LOGGING false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Verify migrations and repository integration
        run: bun run prisma:verify:migrations

  sync-docs:
    name: Sync Service Docs To Central Repo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - database-verification
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Prepare docs sync bundle (.md -> .mdx)
        run: bun run docs:prepare:sync-bundle

      - name: Push docs to bisakerja-docs develop
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_REPO_TOKEN }}
        with:
          source-directory: .tmp/docs-sync
          destination-github-username: bisa-kerja
          destination-repository-name: bisakerja-docs
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          commit-message: >-
            sync: backend-api docs from ${{ github.ref_name }} (${{ github.sha }})
          target-directory: docs/services/backend-api/synced
          target-branch: develop
