name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality And Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
      DIRECT_DATABASE_URL: ""
      RUN_DATABASE_TESTS: "false"
      MODEL_API_ENABLE_MOCK: "true"
      LOG_LEVEL: silent
      ENABLE_REQUEST_LOGGING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Prisma validate
        run: bun run prisma:validate

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Generate docs artifacts
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bun run docs:generate:openapi
          bun run docs:generate:routes
          bun run docs:generate:sync-readiness

      - name: Validate docs
        run: |
          bun run docs:check
          bun run docs:scalar:check-config

      - name: Ensure committed OpenAPI artifact is in sync
        run: git diff --exit-code -- docs/generated/openapi.json

      - name: Run default test suite
        run: bun test

      - name: Run route tests
        run: bun run test:routes

      - name: Run contract tests
        run: bun run test:contracts

      - name: Run smoke tests
        run: bun run test:smoke

  database-verification:
    name: Database Integration And Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bisakerja_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bisakerja_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
      DIRECT_DATABASE_URL: ""
      RUN_DATABASE_TESTS: "true"
      MODEL_API_ENABLE_MOCK: "true"
      LOG_LEVEL: silent
      ENABLE_REQUEST_LOGGING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Verify migrations and repository integration
        run: bun run prisma:verify:migrations

  sync-docs:
    name: Sync Service Docs To Central Repo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - database-verification
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push docs to bisakerja-docs develop
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_REPO_TOKEN }}
        with:
          source-directory: docs
          destination-github-username: bisa-kerja
          destination-repository-name: bisakerja-docs
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          commit-message: >-
            sync: backend-api docs from ${{ github.ref_name }} (${{ github.sha }})
          target-directory: docs/services/backend-api/synced
          target-branch: develop
