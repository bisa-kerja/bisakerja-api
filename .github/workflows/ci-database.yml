name: CI Database

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-verification:
    name: Database Integration And Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bisakerja_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bisakerja_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bisakerja_api_test
      DIRECT_DATABASE_URL: ""
      RUN_DATABASE_TESTS: "true"
      MODEL_API_ENABLE_MOCK: "true"
      LOG_LEVEL: silent
      ENABLE_REQUEST_LOGGING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Verify migrations and repository integration
        run: bun run prisma:verify:migrations
